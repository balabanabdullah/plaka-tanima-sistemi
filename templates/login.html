{% extends "base.html" %}

{% block title %}Yönetici Girişi | Plaka Sistemi{% endblock %}

{% block content %}
<section class="section" style="max-width: 460px; margin: 60px auto;">
    <div class="page-header">
        <h1 class="page-title">Yönetici Girişi</h1>
        <span class="page-subtitle">Plaka güvenlik paneline erişmek için giriş yapın</span>
    </div>

    {% if error %}
    <div class="empty-state" role="alert">
        <p>{{ error }}</p>
    </div>
    {% endif %}

    <form method="post" action="/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div style="margin-bottom: 18px;">
            <label for="username">Kullanıcı adı</label>
            <input id="username" name="username" type="text" required autocomplete="username" class="reason-input" style="display: block; width: 100%; margin-top: 6px;">
        </div>

        <div style="margin-bottom: 22px;">
            <label for="password">Parola</label>
            <input id="password" name="password" type="password" required autocomplete="current-password" class="reason-input" style="display: block; width: 100%; margin-top: 6px;">
        </div>

        <button type="submit" class="btn btn-approve">Giriş Yap</button>
    </form>
</section>
{% endblock %}
